<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>단어장</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 100px 24px 24px;
    }

    .container {
      width: 100%;
      max-width: 1120px;
    }

    .top-box,
    .word-area,
    .note-list {
      display: flex;
      flex-direction: column;
    }

    .top-box { gap: 12px; margin-bottom: 24px; }
    .word-area { gap: 2px; padding-left: 0; min-width: 0; }
    .note-list { gap: 10px; }

    .word-input,
    .meaning-input,
    .pronunciation-input,
    .search-input,
    .filter-select,
    .bulk-textarea,
    .tool-select,
    .password-input {
      width: 100%;
      border: 1px solid #d8d8d8;
      outline: none;
      background: #fff;
    }

    .word-input,
    .meaning-input,
    .pronunciation-input,
    .password-input {
      padding: 14px;
      font-size: 15px;
      border-radius: 12px;
    }

    .search-input,
    .filter-select,
    .bulk-textarea,
    .tool-select {
      border-color: #dcdcdc;
    }

    .word-input {
      font-family: "바탕", Batang, serif;
    }

    .word-input.is-english {
      font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
    }

    .meaning-input,
    .pronunciation-input,
    .search-input,
    .filter-select,
    .bulk-textarea,
    .tool-select,
    .password-input {
      font-family: "바탕", Batang, serif;
    }

    .word-input:focus,
    .meaning-input:focus,
    .pronunciation-input:focus,
    .search-input:focus,
    .filter-select:focus,
    .bulk-textarea:focus,
    .tool-select:focus,
    .password-input:focus {
      border-color: #555;
    }

    .word-input::placeholder,
    .meaning-input::placeholder,
    .pronunciation-input::placeholder,
    .search-input::placeholder,
    .bulk-textarea::placeholder,
    .password-input::placeholder {
      font-size: 12px;
      color: #888;
      font-family: "바탕", Batang, serif;
    }

    .button-row,
    .bulk-actions,
    .modal-actions,
    .info-inline,
    .word-inline,
    .toolbar-main,
    .toolbar-controls,
    .password-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .info-inline,
.word-inline {
  gap: 8px;
  align-items: baseline;
}

.word-inline {
  display: flex;
  flex-wrap: nowrap;
  min-width: 0;
  overflow: hidden;
}

    .action-btn,
    .file-label,
    .modal-btn,
    .password-btn {
      border: none;
      color: #fff;
      cursor: pointer;
      text-align: center;
    }

    .action-btn,
    .file-label,
    .password-btn {
      flex: 1;
      min-width: 120px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #2f2f2f;
      font-size: 12px;
      font-family: "바탕", Batang, serif;
      transition: background 0.2s ease;
    }

    .action-btn:hover,
    .file-label:hover,
    .top-button:hover,
    .password-btn:hover { background: #444; }

    .floating-hide-button:hover {
      background: rgba(17, 17, 17, 0.18);
    }

    .danger-btn,
    .modal-btn.danger { background: #c94f4f; }

    .danger-btn:hover,
    .modal-btn.danger:hover { background: #b93c3c; }

    #lockButton {
      background: #999;
    }

    #lockButton:hover {
      background: #777;
    }

    #backToListButton {
  display: none;
  background: #4a78ff;
}

#backToListButton:hover {
  background: #365fe0;
}

#backToListButton.show {
  display: inline-flex;
  justify-content: center;
  align-items: center;
}

    .file-label {
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .hidden-file { display: none; }

    .help-text,
    .info-title,
    .message,
    .preview-note,
    .selected-pos-text,
    .check-box,
    .menu-item,
    .modal-title,
    .modal-text,
    .modal-btn,
    .top-button,
    .toolbar-title,
    .toolbar-meta,
    .tool-chip,
    .tool-select,
    .password-title,
    .password-desc,
    .password-message,
    .floating-hide-button {
      font-family: "바탕", Batang, serif;
    }

    .help-text {
      font-size: 11px;
      color: #777;
      margin-top: -4px;
    }

    .info-box,
    .bulk-box,
    .note-item,
    .toolbar-box,
    .password-box {
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      background: #fafafa;
      padding: 14px;
    }

    .note-item {
      background: #fff;
      border-color: #e6e6e6;
      position: relative;
    }

    .note-item.selected-delete {
      border-color: #d36a6a;
      background: #fff8f8;
    }

    .info-title {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .info-word {
      font-size: 18px;
      font-weight: 700;
      font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
    }

    .info-pron {
      font-size: 13px;
      color: #666;
      font-family: "바탕", Batang, serif;
    }

    .info-meaning {
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      font-family: "바탕", Batang, serif;
      color: #333;
      margin-top: 6px;
    }

    .message {
      min-height: 20px;
      text-align: center;
      font-size: 13px;
      color: #666;
    }

    .toolbar-box {
      background: #fcfcfc;
      margin-bottom: 16px;
      padding: 16px;
    }

    .toolbar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }

    .toolbar-title {
      font-size: 14px;
      color: #222;
      font-weight: 700;
    }

    .toolbar-meta {
      font-size: 12px;
      color: #666;
    }

    .toolbar-main {
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    .toolbar-main::-webkit-scrollbar { height: 8px; }

    .toolbar-main::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 999px;
    }

    .search-wrap {
      position: relative;
      min-width: 280px;
      flex: 1 1 320px;
    }

    .search-input {
      min-height: 48px;
      padding: 10px 40px 10px 10px;
      border-radius: 10px;
      font-size: 12px;
      background: #fff;
    }

    .search-clear-btn {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 999px;
      background: #d9d9d9;
      color: #444;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .search-clear-btn.show { display: inline-flex; }
    .search-clear-btn:hover { background: #bfbfbf; }

    .toolbar-controls {
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .tool-chip,
    .tool-select {
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid #d8d8d8;
      border-radius: 12px;
      background: #fff;
      font-size: 12px;
      color: #333;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-family: "바탕", Batang, serif;
    }

    .tool-chip label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tool-select {
      text-align-last: center;
      cursor: pointer;
      width: auto;
    }

    .toolbar-delete-btn,
    .unlock-reset-btn {
      min-height: 48px;
      padding: 10px 12px;
      border-radius: 12px;
      border: none;
      background: #d85b5b;
      color: #fff;
      font-size: 12px;
      font-family: "바탕", Batang, serif;
      cursor: pointer;
      white-space: nowrap;
    }

    .toolbar-delete-btn:hover,
    .unlock-reset-btn:hover { background: #c74848; }

    .bulk-box { display: none; }
    .bulk-box.show { display: block; }

    .bulk-textarea {
      min-height: 160px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
    }

    .note-clickable { cursor: pointer; }

    .note-line {
      display: grid;
      grid-template-columns: 44px minmax(220px, 1.5fr) minmax(220px, 1.8fr) max-content auto auto auto auto;
      column-gap: 14px;
      row-gap: 10px;
      align-items: center;
    }

    .pos-buttons {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-start;
      min-width: max-content;
      white-space: nowrap;
      transform: translateX(-6px);
      margin-right: 18px;
    }

    .delete-check-wrap,
    .menu-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-wrap {
      position: relative;
    }

    .note-word {
  font-size: 16px;
  font-weight: 700;
  white-space: nowrap;
  flex: 0 0 auto;
  font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
  display: inline;
}

    .note-pron {
  font-size: 12px;
  color: #666;
  font-family: "바탕", Batang, serif;
  display: inline-block;
  margin-left: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 1 1 auto;
}

    .selected-pos-text {
      font-size: 11px;
      color: #777;
      line-height: 1.3;
      min-height: 14px;
    }

    .note-meaning {
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
      font-family: "바탕", Batang, serif;
      display: inline-block;
      margin-top: 2px;
    }

    .pos-btn {
      border: 1px solid #dfe6ff;
      background: #fff;
      color: #666;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.2;
      cursor: pointer;
      font-family: "바탕", Batang, serif;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .pos-btn.active-noun { background: #7fb0ff; color: #fff; border-color: #7fb0ff; }
    .pos-btn.active-verb { background: #ff8e8e; color: #fff; border-color: #ff8e8e; }
    .pos-btn.active-adj  { background: #f3c76a; color: #fff; border-color: #f3c76a; }
    .pos-btn.active-adv  { background: #af8cff; color: #fff; border-color: #af8cff; }
    .pos-btn.active-conj { background: #67cfc5; color: #fff; border-color: #67cfc5; }
    .pos-btn.active-excl { background: #f48db3; color: #fff; border-color: #f48db3; }

    .check-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .check-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      white-space: nowrap;
      text-align: center;
    }

    .check-box input[type="checkbox"] {
      width: 14px;
      height: 14px;
    }

    .menu-wrap { position: relative; }

    .menu-btn {
      width: 34px;
      height: 34px;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .menu-btn:hover {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .menu-popup {
      display: none;
      position: absolute;
      top: 40px;
      right: 0;
      min-width: 140px;
      background: #fff;
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      overflow: hidden;
      z-index: 10;
    }

    .menu-popup.show { display: block; }

    .menu-item {
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: #fff;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
    }

    .menu-item:hover { background: #f2f2f2; }

    .highlight-word,
    .highlight-meaning {
      border-radius: 2px;
      padding: 0 1px;
      display: inline;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .highlight-word { background: linear-gradient(transparent 55%, #fff2a8 55%); }
    .highlight-meaning { background: linear-gradient(transparent 55%, #b9f3c9 55%); }

    .memorized { opacity: 0.55; }

    .empty-text {
      color: #888;
      font-size: 14px;
      text-align: center;
      padding: 24px 0;
      font-family: "바탕", Batang, serif;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.28);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: 100%;
      max-width: 760px;
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      max-height: 90vh;
      overflow: auto;
    }

    .modal.small { max-width: 460px; }

    .modal-title {
      font-size: 16px;
      margin-bottom: 12px;
      text-align: center;
    }

    .modal-text {
      font-size: 13px;
      line-height: 1.6;
      color: #444;
      white-space: pre-line;
      margin-bottom: 16px;
      text-align: center;
    }

    .modal-btn {
      flex: 1;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      background: #111;
    }

    .modal-btn.cancel { background: #999; }

    .preview-table-wrap {
      overflow-x: auto;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .preview-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      font-family: "바탕", Batang, serif;
      font-size: 13px;
    }

    .preview-table th,
    .preview-table td {
      border-bottom: 1px solid #ececec;
      padding: 10px 8px;
      text-align: center;
      vertical-align: middle;
      white-space: pre-wrap;
    }

    .preview-table th {
      background: #f7f7f7;
      font-weight: 700;
    }

    .preview-note {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      text-align: center;
    }

    .top-button {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.16);
      display: none;
      z-index: 60;
    }

    .top-button.show { display: block; }

    .floating-hide-button {
      position: fixed;
      top: 22px;
      right: 22px;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 999px;
      background: rgba(17, 17, 17, 0.1);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      display: none;
      z-index: 70;
    }

    .floating-hide-button.active {
      background: rgba(70, 130, 255, 0.1);
    }

    .floating-hide-button.active:hover {
      background: rgba(70, 130, 255, 0.18);
    }

    .app-shell.hidden,
    .password-screen.hidden {
      display: none;
    }

    .password-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      max-width: none;
      margin: 0;
    }

    .password-box {
      width: 100%;
      max-width: 460px;
    }

    .password-title {
      font-size: 20px;
      text-align: center;
      margin-bottom: 10px;
    }

    .password-desc {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .password-message {
      min-height: 20px;
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #c74848;
    }

    .password-sub {
      margin-top: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .password-desc {
        font-size: 11px;
        line-height: 1.5;
      }

      .check-box {
        font-size: 11px;
      }

      .check-box input[type="checkbox"] {
        width: 14px;
        height: 14px;
      }

      .note-line {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "word menu"
          "meaning meaning"
          "pos pos"
          "checks checks";
        column-gap: 10px;
        row-gap: 14px;
        align-items: start;
      }

      .toolbar-main {
        flex-wrap: wrap;
        overflow-x: visible;
      }

      .toolbar-controls {
        flex-wrap: wrap;
        width: 100%;
        gap: 10px;
      }

      .search-wrap {
        min-width: 100%;
        flex: 1 1 100%;
      }

      .delete-check-wrap {
        display: none;
      }

      .word-inline {
        display: flex;
        align-items: baseline;
        flex-direction: row;
        gap: 6px;
        flex-wrap: wrap;
      }

      .info-inline {
        align-items: baseline;
        flex-direction: row;
        gap: 6px;
        flex-wrap: wrap;
      }

      .word-area {
        grid-area: word;
        width: 100%;
        padding-right: 8px;
      }

      .note-line > div[data-load] {
        width: 100%;
      }

      .note-line > div[data-load]:has(.note-meaning) {
        grid-area: meaning;
      }

      .pos-buttons {
        grid-area: pos;
        transform: none;
        margin-right: 0;
        flex-wrap: wrap;
        gap: 8px;
      }

      .check-row {
        grid-area: checks;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        flex-wrap: nowrap;
        white-space: nowrap;
        width: 100%;
        min-width: 0;
        margin-top: 2px;
      }

      .check-box {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        font-size: 13px;
        white-space: nowrap;
        flex: 0 0 auto;
      }

      .menu-wrap {
        grid-area: menu;
        display: flex;
        justify-content: flex-end;
        align-self: start;
        justify-self: end;
      }

      .menu-popup {
        right: 0;
        left: auto;
      }

      .tool-chip,
      .tool-select,
      .toolbar-delete-btn {
        flex: 1 1 calc(50% - 5px);
        min-width: 0;
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 12px;
        box-sizing: border-box;
      }

      .tool-chip {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .tool-chip label {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .tool-select,
      .toolbar-delete-btn,
      .tool-chip {
        min-height: 44px;
      }

      .toolbar-box,
      .note-item,
      .info-box,
      .bulk-box {
        border-radius: 16px;
      }

      .note-item {
        padding: 16px;
      }

      .floating-hide-button {
        top: 16px;
        right: 16px;
        width: 38px;
        height: 38px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="password-screen" id="passwordScreen">
    <div class="password-box">
      <div class="password-title">영단어 오답노트</div>

      <div class="password-desc">
        사용하려면 비밀번호를 입력하세요.<br>
        한 번 통과하면 같은 브라우저에서는 다시 묻지 않습니다.
      </div>

      <input
        type="password"
        id="passwordInput"
        class="password-input"
        placeholder="비밀번호 입력"
        autocomplete="current-password"
      />

      <div class="password-actions" style="margin-top:12px;">
        <button class="password-btn" id="passwordSubmitButton" type="button">들어가기</button>
      </div>

      <div class="password-message" id="passwordMessage"></div>
    </div>
  </div>

  <div class="container app-shell hidden" id="appShell">
    <div class="top-box">
      <input
        type="text"
        id="wordInput"
        class="word-input"
        placeholder="영단어를 입력하세요"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      />

      <input
        type="text"
        id="meaningInput"
        class="meaning-input"
        placeholder="뜻을 입력하세요"
      />

      <input
        type="text"
        id="pronunciationInput"
        class="pronunciation-input"
        placeholder="발음 입력 (선택사항)"
      />

      <div class="help-text">
        단어, 뜻, 발음을 입력한 뒤 Enter 또는 저장 버튼으로 저장할 수 있습니다.
      </div>

      <div class="button-row">
        <button class="action-btn" id="resetButton" type="button">초기화</button>
        <button class="action-btn" id="naverButton" type="button">사전</button>
        <button class="action-btn" id="saveButton" type="button">저장</button>
        <button class="action-btn" id="backToListButton" type="button">제자리</button>
        <label class="file-label" for="fileInput">파일 불러오기</label>
        <input class="hidden-file" type="file" id="fileInput" accept=".txt,.csv" />
        <button class="action-btn" id="bulkToggleButton" type="button">복붙 가져오기</button>
        <button class="action-btn" id="lockButton" type="button">다시 잠그기</button>
      </div>

      <div class="bulk-box" id="bulkBox">
        <div class="info-title">여러 줄 가져오기</div>
        <textarea
          id="bulkInput"
          class="bulk-textarea"
          placeholder="예시&#10;run: 달리다, 달리기 : 런 : 동, 명&#10;and: 그리고 : 앤드 : 접&#10;wow: 와! : 와우 : 감"
        ></textarea>
        <div class="bulk-actions">
          <button class="action-btn" id="bulkPreviewButton" type="button">미리보기</button>
          <button class="action-btn" id="bulkClearButton" type="button">입력 지우기</button>
        </div>
      </div>

      <div class="info-box">
        <div class="info-title">조회 결과</div>
        <div class="info-inline">
          <div class="info-word" id="resultWord"></div>
          <div class="info-pron" id="resultPronunciation"></div>
        </div>
        <div class="info-meaning" id="resultMeaning"></div>
      </div>

      <div class="message" id="message"></div>

      <div class="toolbar-box">
        <div class="toolbar-head">
          <div class="toolbar-title">저장된 단어</div>
          <div class="toolbar-meta" id="statsText">전체 0개 · 숨김 0개</div>
        </div>

        <div class="toolbar-main">
          <div class="search-wrap">
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="검색 / 단어 / 뜻 / 발음 / 품사"
            />
            <button id="searchClearButton" class="search-clear-btn" type="button">×</button>
          </div>

          <div class="toolbar-controls">
            <div class="tool-chip">
              <label>
                <input type="checkbox" id="selectAllDelete" />
                전체 선택
              </label>
            </div>

            <button class="toolbar-delete-btn" id="deleteSelectedButton" type="button">선택 삭제</button>

            <div class="tool-chip">
              <label>
                <input type="checkbox" id="hideMemorized" />
                외운 단어 숨기기
              </label>
            </div>

            <select id="sortSelect" class="tool-select">
              <option value="latest">정렬: 최신순</option>
              <option value="alphabet">정렬: 알파벳순</option>
              <option value="memorized">정렬: 외운 순</option>
            </select>
          </div>
        </div>
      </div>

      <div class="note-list" id="noteList"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="confirmModal">
    <div class="modal small">
      <div class="modal-title">이미 저장된 단어입니다</div>
      <div class="modal-text" id="modalText"></div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modalCancel" type="button">취소</button>
        <button class="modal-btn" id="modalConfirm" type="button">수정</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="deleteConfirmModal">
    <div class="modal small">
      <div class="modal-title" id="deleteModalTitle">삭제 확인</div>
      <div class="modal-text" id="deleteModalText">정말 삭제하시겠습니까?</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="deleteModalCancel" type="button">취소</button>
        <button class="modal-btn danger" id="deleteModalConfirm" type="button">삭제</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="previewModal">
    <div class="modal">
      <div class="modal-title">가져오기 미리보기</div>
      <div class="preview-note" id="previewNote"></div>
      <div class="preview-table-wrap">
        <table class="preview-table">
          <thead>
            <tr>
              <th>번호</th>
              <th>단어</th>
              <th>뜻</th>
              <th>발음</th>
              <th>품사</th>
            </tr>
          </thead>
          <tbody id="previewTableBody"></tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="previewCancel" type="button">취소</button>
        <button class="modal-btn" id="previewConfirm" type="button">가져오기 실행</button>
      </div>
    </div>
  </div>

  <button id="topButton" class="top-button" type="button">↑</button>
  <button id="floatingHideButton" class="floating-hide-button" type="button">숨</button>

  <script>
    const APP_PASSWORD = 'dhekqshxm';
    const UNLOCK_KEY = 'wrongAnswerWordsUnlocked';

    const $ = id => document.getElementById(id);

    const els = {
      passwordScreen: $('passwordScreen'),
      appShell: $('appShell'),
      passwordInput: $('passwordInput'),
      passwordSubmitButton: $('passwordSubmitButton'),
      passwordMessage: $('passwordMessage'),

      wordInput: $('wordInput'),
      meaningInput: $('meaningInput'),
      pronunciationInput: $('pronunciationInput'),
      resetButton: $('resetButton'),
      naverButton: $('naverButton'),
      saveButton: $('saveButton'),
      backToListButton: $('backToListButton'),
      fileInput: $('fileInput'),
      bulkToggleButton: $('bulkToggleButton'),
      lockButton: $('lockButton'),
      bulkBox: $('bulkBox'),
      bulkInput: $('bulkInput'),
      bulkPreviewButton: $('bulkPreviewButton'),
      bulkClearButton: $('bulkClearButton'),
      resultWord: $('resultWord'),
      resultPronunciation: $('resultPronunciation'),
      resultMeaning: $('resultMeaning'),
      message: $('message'),
      searchInput: $('searchInput'),
      searchClearButton: $('searchClearButton'),
      statsText: $('statsText'),
      noteList: $('noteList'),
      hideMemorized: $('hideMemorized'),
      sortSelect: $('sortSelect'),
      selectAllDelete: $('selectAllDelete'),
      deleteSelectedButton: $('deleteSelectedButton'),
      confirmModal: $('confirmModal'),
      modalText: $('modalText'),
      modalCancel: $('modalCancel'),
      modalConfirm: $('modalConfirm'),
      deleteConfirmModal: $('deleteConfirmModal'),
      deleteModalTitle: $('deleteModalTitle'),
      deleteModalText: $('deleteModalText'),
      deleteModalCancel: $('deleteModalCancel'),
      deleteModalConfirm: $('deleteModalConfirm'),
      previewModal: $('previewModal'),
      previewTableBody: $('previewTableBody'),
      previewNote: $('previewNote'),
      previewCancel: $('previewCancel'),
      previewConfirm: $('previewConfirm'),
      topButton: $('topButton'),
      floatingHideButton: $('floatingHideButton')
    };

    let pendingUpdateWord = null;
    let editingId = null;
    let pendingDeleteAction = null;
    let pendingImportRows = [];
    let lastScrollY = 0;
    let canReturnToList = false;

    const POS_MAP = {
      '명': '명', '명사': '명',
      '동': '동', '동사': '동',
      '형': '형', '형용사': '형',
      '부': '부', '부사': '부',
      '접': '접', '접속사': '접',
      '감': '감', '감탄사': '감'
    };

    function isUnlocked() {
      return localStorage.getItem(UNLOCK_KEY) === 'true';
    }

    function showFloatingHideButton() {
      if (els.floatingHideButton) {
        els.floatingHideButton.style.display = 'block';
      }
    }

    function hideFloatingHideButton() {
      if (els.floatingHideButton) {
        els.floatingHideButton.style.display = 'none';
      }
    }

    function showBackToListButton() {
      if (els.backToListButton) {
        els.backToListButton.classList.add('show');
      }
    }

    function hideBackToListButton() {
      if (els.backToListButton) {
        els.backToListButton.classList.remove('show');
      }
    }

    function syncHideMemorizedUI() {
      if (els.hideMemorized && els.floatingHideButton) {
        els.floatingHideButton.classList.toggle('active', els.hideMemorized.checked);
        els.floatingHideButton.textContent = '숨';
        els.floatingHideButton.title = els.hideMemorized.checked
          ? '외운 단어 숨기기 해제'
          : '외운 단어 숨기기';
      }
    }

    function unlockApp() {
      localStorage.setItem(UNLOCK_KEY, 'true');
      els.passwordScreen.classList.add('hidden');
      els.appShell.classList.remove('hidden');
      showFloatingHideButton();

      setTimeout(() => {
        updateWordInputFont();
        resetResult();
        syncHideMemorizedUI();
        hideBackToListButton();
        renderNotes();
        els.wordInput.focus();
      }, 0);
    }

    function lockApp() {
      localStorage.removeItem(UNLOCK_KEY);
      els.appShell.classList.add('hidden');
      els.passwordScreen.classList.remove('hidden');
      hideFloatingHideButton();
      hideBackToListButton();
      canReturnToList = false;
      els.passwordInput.value = '';
      els.passwordMessage.textContent = '잠금이 다시 설정되었습니다.';
      els.passwordInput.focus();
    }

    function tryUnlock() {
      const value = els.passwordInput.value;
      if (value === APP_PASSWORD) {
        els.passwordMessage.textContent = '';
        unlockApp();
      } else {
        els.passwordMessage.textContent = '비밀번호가 올바르지 않습니다.';
        els.passwordInput.select();
      }
    }

    function getNotes() {
      return JSON.parse(localStorage.getItem('wrongAnswerWords') || '[]').map(note => ({
        ...note,
        pronunciation: note.pronunciation || '',
        pos: Array.isArray(note.pos) ? note.pos : [],
        checkedForDelete: Boolean(note.checkedForDelete)
      }));
    }

    function saveNotes(notes) {
      localStorage.setItem('wrongAnswerWords', JSON.stringify(notes));
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showMessage(text) {
      els.message.textContent = text;
      setTimeout(() => {
        els.message.textContent = '';
      }, 2200);
    }

    function resetResult() {
      els.resultWord.textContent = '';
      els.resultPronunciation.textContent = '';
      els.resultMeaning.textContent = '';
    }

    function clearInputs() {
      els.wordInput.value = '';
      els.meaningInput.value = '';
      els.pronunciationInput.value = '';
      editingId = null;
      updateWordInputFont();
      resetResult();
      hideBackToListButton();
      canReturnToList = false;
    }

    function setTopFields(word, meaning, pronunciation = '') {
      els.wordInput.value = word || '';
      els.meaningInput.value = meaning || '';
      els.pronunciationInput.value = pronunciation || '';
      updateWordInputFont();
      els.resultWord.textContent = word || '';
      els.resultPronunciation.textContent = pronunciation || '';
      els.resultMeaning.textContent = meaning || '';
    }

    function isEnglishWord(word) {
      return /^[A-Za-z][A-Za-z\s'-]*$/.test(word);
    }

    function normalizeText(value) {
      return String(value || '').trim().replace(/\s+/g, ' ');
    }

    function normalizePosList(posText) {
      if (!posText) return [];
      return String(posText)
        .split(',')
        .map(v => v.trim())
        .map(v => POS_MAP[v] || '')
        .filter(Boolean)
        .filter((v, i, arr) => arr.indexOf(v) === i);
    }

    function updateWordInputFont() {
      const value = els.wordInput.value.trim();
      if (value && isEnglishWord(value)) {
        els.wordInput.classList.add('is-english');
      } else {
        els.wordInput.classList.remove('is-english');
      }
    }

    function fetchMeaning(word) {
      const cleanedWord = word.trim().toLowerCase();

      if (!cleanedWord) {
        resetResult();
        return false;
      }

      if (!isEnglishWord(cleanedWord)) {
        els.resultWord.textContent = cleanedWord;
        els.resultPronunciation.textContent = '';
        els.resultMeaning.textContent = '정확한 영어 단어를 입력해주세요.';
        return false;
      }

      els.resultWord.textContent = cleanedWord;

      const notes = getNotes();
      const savedNote = notes.find(item => item.word.toLowerCase() === cleanedWord);

      if (savedNote) {
        els.resultPronunciation.textContent = savedNote.pronunciation || '';
        els.resultMeaning.textContent = savedNote.meaning;

        if (!els.meaningInput.value.trim()) {
          els.meaningInput.value = savedNote.meaning;
        }

        if (!els.pronunciationInput.value.trim() && savedNote.pronunciation) {
          els.pronunciationInput.value = savedNote.pronunciation;
        }

        return true;
      }

      els.resultPronunciation.textContent = '';
      els.resultMeaning.textContent = '저장된 단어가 없습니다.';
      return false;
    }

    function openNaverDictionary(word) {
      const cleanedWord = word.trim();
      if (!cleanedWord) {
        showMessage('사전으로 찾을 단어를 입력해주세요.');
        return;
      }
      window.open('https://en.dict.naver.com/#/search?query=' + encodeURIComponent(cleanedWord), '_blank');
    }

    function findNoteIndex(word, notes = getNotes()) {
      return notes.findIndex(item => item.word.toLowerCase() === word.toLowerCase());
    }

    function createNote({ word, meaning, pronunciation = '', pos = [] }) {
      return {
        id: Date.now() + Math.random(),
        word,
        meaning,
        pronunciation,
        pos,
        checkWord: false,
        checkMeaning: false,
        checkMemorized: false,
        checkedForDelete: false,
        createdAt: Date.now()
      };
    }

    function sortNotes(notes) {
      const type = els.sortSelect.value;
      if (type === 'alphabet') return [...notes].sort((a, b) => a.word.localeCompare(b.word));
      if (type === 'memorized') return [...notes].sort((a, b) => Number(a.checkMemorized) - Number(b.checkMemorized));
      return [...notes].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    }

    function getFilteredNotes(sourceNotes = getNotes()) {
      const keyword = els.searchInput.value.trim().toLowerCase();
      const hideChecked = els.hideMemorized.checked;

      let filtered = sourceNotes.filter(note =>
        note.word.toLowerCase().includes(keyword) ||
        note.meaning.toLowerCase().includes(keyword) ||
        String(note.pronunciation || '').toLowerCase().includes(keyword) ||
        note.pos.join(',').toLowerCase().includes(keyword)
      );

      if (hideChecked) filtered = filtered.filter(note => !note.checkMemorized);
      return sortNotes(filtered);
    }

    function updateSearchClearButton() {
      els.searchClearButton.classList.toggle('show', !!els.searchInput.value.trim());
    }

    function updateStats(notes = getNotes()) {
      const hiddenCount = notes.filter(note => note.checkMemorized).length;
      els.statsText.textContent = `전체 ${notes.length}개 · 숨김 ${hiddenCount}개`;
    }

    function syncSelectAllState(notes) {
      const visibleNotes = getFilteredNotes(notes);
      els.selectAllDelete.checked = visibleNotes.length > 0 && visibleNotes.every(note => note.checkedForDelete);
    }

    function renderNotes() {
      const notes = getNotes();
      const filtered = getFilteredNotes(notes);

      els.noteList.innerHTML = '';
      updateStats(notes);
      updateSearchClearButton();
      syncSelectAllState(notes);
      syncHideMemorizedUI();

      if (!filtered.length) {
        els.noteList.innerHTML = '<div class="empty-text">저장된 오답노트가 없습니다.</div>';
        return;
      }

      filtered.forEach(note => {
        const posList = note.pos || [];
        const posText = posList.join(' · ');
        const item = document.createElement('div');

        item.className =
          'note-item note-clickable' +
          (note.checkMemorized ? ' memorized' : '') +
          (note.checkedForDelete ? ' selected-delete' : '');

        item.innerHTML = `
          <div class="note-line">
            <div class="delete-check-wrap">
              <input type="checkbox" ${note.checkedForDelete ? 'checked' : ''} data-delete-check="${note.id}">
            </div>

            <div class="word-area" data-load="${note.id}">
              <div class="word-inline">
                <span class="note-word ${note.checkWord ? 'highlight-word' : ''}">${escapeHtml(note.word)}</span>
                <span class="note-pron">${escapeHtml(note.pronunciation || '')}</span>
              </div>
              ${posText ? `<div class="selected-pos-text">${escapeHtml(posText)}</div>` : ''}
            </div>

            <div data-load="${note.id}">
              <span class="note-meaning ${note.checkMeaning ? 'highlight-meaning' : ''}">${escapeHtml(note.meaning)}</span>
            </div>

            <div class="pos-buttons">
              ${createPosButton(note.id, posList, '명', 'active-noun')}
              ${createPosButton(note.id, posList, '동', 'active-verb')}
              ${createPosButton(note.id, posList, '형', 'active-adj')}
              ${createPosButton(note.id, posList, '부', 'active-adv')}
              ${createPosButton(note.id, posList, '접', 'active-conj')}
              ${createPosButton(note.id, posList, '감', 'active-excl')}
            </div>

            <div class="check-row">
              ${createCheckLabel(note.id, 'checkWord', note.checkWord, '단어')}
              ${createCheckLabel(note.id, 'checkMeaning', note.checkMeaning, '뜻')}
              ${createCheckLabel(note.id, 'checkMemorized', note.checkMemorized, '외움')}
            </div>

            <div class="menu-wrap">
              <button class="menu-btn" data-menu-btn="${note.id}" type="button">⋯</button>
              <div class="menu-popup" id="menu-${note.id}">
                <button class="menu-item" data-edit="${note.id}" type="button">수정</button>
                <button class="menu-item" data-delete="${note.id}" type="button">삭제</button>
              </div>
            </div>
          </div>
        `;

        els.noteList.appendChild(item);
      });

      bindNoteEvents();
    }

    function createPosButton(id, posList, label, activeClass) {
      return `<button class="pos-btn ${posList.includes(label) ? activeClass : ''}" data-pos-id="${id}" data-pos="${label}" type="button">${label}</button>`;
    }

    function createCheckLabel(id, key, checked, label) {
      return `
        <label class="check-box">
          <input type="checkbox" ${checked ? 'checked' : ''} data-id="${id}" data-key="${key}">
          ${label}
        </label>
      `;
    }

    function bindNoteEvents() {
      els.noteList.querySelectorAll('input[type="checkbox"]').forEach(box => {
        box.addEventListener('click', e => e.stopPropagation());
      });

      els.noteList.querySelectorAll('[data-delete-check]').forEach(box => {
        box.addEventListener('change', () => toggleDeleteCheck(Number(box.dataset.deleteCheck)));
      });

      els.noteList.querySelectorAll('input[data-id][data-key]').forEach(box => {
        box.addEventListener('change', () => toggleCheck(Number(box.dataset.id), box.dataset.key));
      });

      els.noteList.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          deleteNote(Number(btn.dataset.delete));
        });
      });

      els.noteList.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          startEdit(Number(btn.dataset.edit));
          closeAllMenus();
        });
      });

      els.noteList.querySelectorAll('[data-menu-btn]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const menu = $('menu-' + btn.dataset.menuBtn);
          const isShown = menu.classList.contains('show');
          closeAllMenus();
          if (!isShown) menu.classList.add('show');
        });
      });

      els.noteList.querySelectorAll('[data-pos-id]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          togglePos(Number(btn.dataset.posId), btn.dataset.pos);
        });
      });

      els.noteList.querySelectorAll('[data-load]').forEach(area => {
        area.addEventListener('click', () => loadNoteToTop(Number(area.dataset.load)));
      });
    }

    function saveCurrentNote(forceUpdate = false) {
      const word = normalizeText(els.wordInput.value);
      const meaning = normalizeText(els.meaningInput.value);
      const pronunciation = normalizeText(els.pronunciationInput.value);

      if (!word) return showMessage('단어를 입력해주세요.');
      if (!meaning) return showMessage('뜻을 입력해주세요.');

      const notes = getNotes();

      if (editingId !== null) {
        const target = notes.find(item => item.id === editingId);
        if (target) {
          target.word = word;
          target.meaning = meaning;
          target.pronunciation = pronunciation;
          saveNotes(notes);
          showMessage('수정되었습니다.');
        }
        clearInputs();
        renderNotes();
        return;
      }

      const existingIndex = findNoteIndex(word, notes);

      if (existingIndex > -1 && !forceUpdate) {
        const oldMeaning = notes[existingIndex].meaning || '';
        const oldPron = notes[existingIndex].pronunciation || '(없음)';
        const newPron = pronunciation || '(없음)';

        els.modalText.textContent =
          '이전에 저장된 내용과 현재 입력한 내용이 다를 수 있습니다.\n\n' +
          '이전 뜻: ' + oldMeaning + '\n' +
          '새 뜻: ' + meaning + '\n\n' +
          '이전 발음: ' + oldPron + '\n' +
          '새 발음: ' + newPron + '\n\n' +
          '수정하시겠습니까?';

        pendingUpdateWord = word;
        els.confirmModal.classList.add('show');
        return;
      }

      if (existingIndex > -1) {
        notes[existingIndex].meaning = meaning;
        notes[existingIndex].pronunciation = pronunciation;
        saveNotes(notes);
        showMessage('기존 단어를 수정했습니다.');
      } else {
        notes.push(createNote({
          word,
          meaning,
          pronunciation,
          pos: []
        }));
        saveNotes(notes);
        showMessage('오답노트에 저장되었습니다.');
      }

      clearInputs();
      renderNotes();
    }

    function startEdit(id) {
      const target = getNotes().find(item => item.id === id);
      if (!target) return;
      lastScrollY = window.scrollY;
      canReturnToList = true;
      showBackToListButton();
      editingId = id;
      setTopFields(target.word, target.meaning, target.pronunciation || '');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showMessage('수정할 내용을 위 입력칸에서 바꾼 뒤 저장하세요.');
    }

    function loadNoteToTop(id) {
      const target = getNotes().find(item => item.id === id);
      if (!target) return;
      lastScrollY = window.scrollY;
      canReturnToList = true;
      showBackToListButton();
      editingId = null;
      setTopFields(target.word, target.meaning, target.pronunciation || '');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function backToSavedPosition() {
      if (!canReturnToList) return;
      window.scrollTo({ top: lastScrollY, behavior: 'smooth' });
      hideBackToListButton();
      canReturnToList = false;
    }

    function toggleCheck(id, key) {
      const notes = getNotes();
      const target = notes.find(item => item.id === id);
      if (!target) return;
      target[key] = !target[key];
      saveNotes(notes);
      renderNotes();
    }

    function toggleDeleteCheck(id) {
      const notes = getNotes();
      const target = notes.find(item => item.id === id);
      if (!target) return;
      target.checkedForDelete = !target.checkedForDelete;
      saveNotes(notes);
      renderNotes();
    }

    function togglePos(id, pos) {
      const notes = getNotes();
      const target = notes.find(item => item.id === id);
      if (!target) return;
      target.pos = target.pos || [];
      target.pos = target.pos.includes(pos)
        ? target.pos.filter(item => item !== pos)
        : [...target.pos, pos];
      saveNotes(notes);
      renderNotes();
    }

    function openDeleteConfirm(title, text, callback) {
      els.deleteModalTitle.textContent = title;
      els.deleteModalText.textContent = text;
      pendingDeleteAction = callback;
      els.deleteConfirmModal.classList.add('show');
    }

    function closeDeleteConfirm() {
      els.deleteConfirmModal.classList.remove('show');
      pendingDeleteAction = null;
    }

    function deleteNote(id) {
      openDeleteConfirm(
        '삭제 확인',
        '선택한 단어를 삭제합니다. 계속하시겠습니까?',
        () => {
          saveNotes(getNotes().filter(item => item.id !== id));
          renderNotes();
          showMessage('삭제되었습니다.');
        }
      );
    }

    function deleteSelectedNotes() {
      const notes = getNotes();
      const selected = notes.filter(note => note.checkedForDelete);

      if (!selected.length) return showMessage('삭제할 항목을 먼저 선택해주세요.');

      openDeleteConfirm(
        '선택 삭제 확인',
        `선택한 ${selected.length}개 항목을 삭제합니다. 계속하시겠습니까?`,
        () => {
          saveNotes(notes.filter(note => !note.checkedForDelete));
          els.selectAllDelete.checked = false;
          renderNotes();
          showMessage(`${selected.length}개 항목을 삭제했습니다.`);
        }
      );
    }

    function closeConfirmModal() {
      els.confirmModal.classList.remove('show');
      pendingUpdateWord = null;
    }

    function parseLine(line, modeHint = '') {
      const raw = String(line || '').trim();
      if (!raw) return null;

      const makeRow = parts => {
        const word = normalizeText(parts[0] || '');
        const meaning = normalizeText(parts[1] || '');
        const pronunciation = normalizeText(parts[2] || '');
        const pos = normalizePosList(parts[3] || '');
        return word && meaning ? { word, meaning, pronunciation, pos } : null;
      };

      if (modeHint === 'csv') return makeRow(raw.split(',').map(v => v.trim()));
      if (raw.includes('\t')) return makeRow(raw.split('\t').map(v => v.trim()));
      if (raw.includes(':')) return makeRow(raw.split(':').map(v => v.trim()));
      if (raw.includes(' - ')) return makeRow(raw.split(' - ').map(v => v.trim()));
      if (raw.includes(' = ')) return makeRow(raw.split(' = ').map(v => v.trim()));
      return null;
    }

    function parseImportText(text, fileName = '') {
      const lines = String(text || '').split(/\r?\n/).map(v => v.trim()).filter(Boolean);
      if (!lines.length) return [];

      const isCsv = fileName.toLowerCase().endsWith('.csv');
      const dataLines = isCsv && lines[0].toLowerCase().includes('word') && lines[0].toLowerCase().includes('meaning')
        ? lines.slice(1)
        : lines;

      return dataLines.map(line => parseLine(line, isCsv ? 'csv' : '')).filter(Boolean);
    }

    function openPreviewModal(rows) {
      pendingImportRows = rows;
      els.previewTableBody.innerHTML = '';
      rows.forEach((row, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${escapeHtml(row.word)}</td>
          <td>${escapeHtml(row.meaning)}</td>
          <td>${escapeHtml(row.pronunciation || '')}</td>
          <td>${escapeHtml((row.pos || []).join(', '))}</td>
        `;
        els.previewTableBody.appendChild(tr);
      });
      els.previewNote.textContent = `총 ${rows.length}개 항목을 가져옵니다. 내용을 확인한 뒤 실행해주세요.`;
      els.previewModal.classList.add('show');
    }

    function closePreviewModal() {
      els.previewModal.classList.remove('show');
      pendingImportRows = [];
    }

    function importWordPairs(rows) {
      const notes = getNotes();
      let added = 0, updated = 0, skipped = 0;

      rows.forEach(({ word, meaning, pronunciation, pos }) => {
        const cleanWord = normalizeText(word);
        const cleanMeaning = normalizeText(meaning);
        const cleanPron = normalizeText(pronunciation);
        const cleanPos = Array.isArray(pos) ? pos : [];

        if (!cleanWord || !cleanMeaning) return skipped++;

        const existingIndex = findNoteIndex(cleanWord, notes);
        if (existingIndex > -1) {
          notes[existingIndex].meaning = cleanMeaning;
          notes[existingIndex].pronunciation = cleanPron;
          notes[existingIndex].pos = cleanPos;
          updated++;
        } else {
          notes.push(createNote({
            word: cleanWord,
            meaning: cleanMeaning,
            pronunciation: cleanPron,
            pos: cleanPos
          }));
          added++;
        }
      });

      saveNotes(notes);
      renderNotes();
      showMessage(`가져오기 완료: 추가 ${added}개, 수정 ${updated}개, 건너뜀 ${skipped}개`);
    }

    function previewImportText(text, fileName = '') {
      const rows = parseImportText(text, fileName);
      if (!rows.length) return showMessage('형식을 읽을 수 없습니다. 예: run: 달리다, 달리기 : 런 : 동, 명');
      openPreviewModal(rows);
    }

    function closeAllMenus() {
      document.querySelectorAll('.menu-popup').forEach(menu => menu.classList.remove('show'));
    }

    els.passwordSubmitButton.addEventListener('click', tryUnlock);

    els.passwordInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        tryUnlock();
      }
    });

    els.resetButton.addEventListener('click', clearInputs);
    els.naverButton.addEventListener('click', () => openNaverDictionary(els.wordInput.value));
    els.saveButton.addEventListener('click', () => saveCurrentNote());
    els.backToListButton.addEventListener('click', backToSavedPosition);
    els.bulkToggleButton.addEventListener('click', () => els.bulkBox.classList.toggle('show'));
    els.lockButton.addEventListener('click', lockApp);

    els.bulkPreviewButton.addEventListener('click', () => previewImportText(els.bulkInput.value, 'bulk.txt'));

    els.bulkClearButton.addEventListener('click', () => {
      els.bulkInput.value = '';
      els.bulkInput.focus();
    });

    els.fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = event => {
        previewImportText(event.target.result, file.name);
        els.fileInput.value = '';
      };
      reader.readAsText(file, 'utf-8');
    });

    els.previewCancel.addEventListener('click', closePreviewModal);

    els.previewConfirm.addEventListener('click', () => {
      if (pendingImportRows.length) importWordPairs(pendingImportRows);
      closePreviewModal();
    });

    els.selectAllDelete.addEventListener('change', () => {
      const visibleIds = getFilteredNotes(getNotes()).map(item => item.id);
      const notes = getNotes();

      notes.forEach(note => {
        if (visibleIds.includes(note.id)) {
          note.checkedForDelete = els.selectAllDelete.checked;
        }
      });

      saveNotes(notes);
      renderNotes();
    });

    els.deleteSelectedButton.addEventListener('click', deleteSelectedNotes);

    els.wordInput.addEventListener('input', () => {
      updateWordInputFont();
      fetchMeaning(els.wordInput.value);
    });

    els.wordInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        fetchMeaning(els.wordInput.value);
        els.meaningInput.focus();
      }
    });

    els.meaningInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        els.pronunciationInput.focus();
      }
    });

    els.pronunciationInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveCurrentNote();
      }
    });

    els.searchInput.addEventListener('input', renderNotes);

    els.hideMemorized.addEventListener('change', () => {
      syncHideMemorizedUI();
      renderNotes();
    });

    if (els.floatingHideButton) {
      els.floatingHideButton.addEventListener('click', () => {
        els.hideMemorized.checked = !els.hideMemorized.checked;
        syncHideMemorizedUI();
        renderNotes();
      });
    }

    els.searchClearButton.addEventListener('click', () => {
      els.searchInput.value = '';
      renderNotes();
    });

    els.sortSelect.addEventListener('change', renderNotes);

    els.modalCancel.addEventListener('click', closeConfirmModal);

    els.modalConfirm.addEventListener('click', () => {
      if (pendingUpdateWord) saveCurrentNote(true);
      closeConfirmModal();
    });

    els.deleteModalCancel.addEventListener('click', closeDeleteConfirm);

    els.deleteModalConfirm.addEventListener('click', () => {
      if (typeof pendingDeleteAction === 'function') pendingDeleteAction();
      closeDeleteConfirm();
    });

    [els.confirmModal, els.deleteConfirmModal, els.previewModal].forEach(modal => {
      modal.addEventListener('click', e => {
        if (e.target !== modal) return;
        if (modal === els.confirmModal) closeConfirmModal();
        if (modal === els.deleteConfirmModal) closeDeleteConfirm();
        if (modal === els.previewModal) closePreviewModal();
      });
    });

    window.addEventListener('scroll', () => {
      els.topButton.classList.toggle('show', window.scrollY > 240);
    });

    els.topButton.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.addEventListener('click', closeAllMenus);

    window.addEventListener('load', () => {
      syncHideMemorizedUI();

      if (isUnlocked()) {
        unlockApp();
      } else {
        hideFloatingHideButton();
        hideBackToListButton();
        els.passwordScreen.classList.remove('hidden');
        els.appShell.classList.add('hidden');
        els.passwordInput.focus();
      }
    });

    window.lockApp = lockApp;
  </script>
</body>
</html>
